name: 병원부 미결 통합 관리 및 리포트 자동 실행

on:
  workflow_dispatch:
    inputs:
      base_month:
        description: '생성 기준월 (YYYY-MM 형식, 예: 2026-10)'
        required: true
        default: '2026-10'
        type: string

jobs:
  run-reconciliation:
    name: 미결 대사 및 통합 엑셀 생성
    runs-on: windows-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 필요 라이브러리 설치 (openpyxl, xlrd)
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl xlrd

      - name: ⚙️ 미결 대사 엔진 실행 및 리포트 생성
        run: |
          python run_reconcile_cli.py --base-month "${{ github.event.inputs.base_month }}"

      - name: 📤 생성된 통합 엑셀 파일 업로드 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 미결(병원부)_통합_${{ github.event.inputs.base_month }}
          path: output/*.xlsx
          retention-days: 90
