<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>토당클럽(테미모) 4분기 클럽데이 | 찬조자 광고지 (A4 2쪽)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- SheetJS for Excel (.xlsx, .xls, .csv) Upload -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --sage-primary: #0F5238;
      --sage-primary-container: #2D6A4F;
      --sage-secondary-container: #CFE9D8;
      --sage-on-secondary-container: #1F352A;
      --sage-tertiary: #783300;
      --sage-tertiary-container: #FFDBCA;
      --sage-surface: #F7FAF7;
      --sage-surface-lowest: #FFFFFF;
      --sage-surface-low: #F1F4F1;
      --sage-surface-container: #ECEFEC;
      --sage-on-surface: #181C1B;
      --sage-on-surface-variant: #404943;
      --sage-outline: #707973;
      --sage-outline-variant: #BFC9C1;

      --ink: #0f172a;
      --ink-soft: #334155;
      --muted: #64748b;
      --line: #e2e8f0;
      --surface: #f8fafc;
      --accent: #0f172a;
      --gold: #b45309;
      --cash-bg: #fffbeb;
      --cash-border: #fcd34d;
      --cash-text: #92400e;
      --cash-badge: #d97706;
      --item-bg: #f0f9ff;
      --item-border: #7dd3fc;
      --item-text: #075985;
      --item-badge: #0284c7;
    }

    [data-theme="sage"] {
      --ink: #181C1B;
      --ink-soft: #404943;
      --muted: #707973;
      --line: #BFC9C1;
      --surface: #F7FAF7;
      --accent: #0F5238;
      --gold: #783300;
      --cash-bg: #FFF8F4;
      --cash-border: #FFDBCA;
      --cash-text: #783300;
      --cash-badge: #B45309;
      --item-bg: #F1F4F1;
      --item-border: #CFE9D8;
      --item-text: #0F5238;
      --item-badge: #2D6A4F;
    }

    [data-theme="emerald"] {
      --ink: #0f2922;
      --ink-soft: #2d4a40;
      --muted: #5b756b;
      --line: #d9e5e0;
      --surface: #f4f8f6;
      --accent: #064e3b;
      --gold: #047857;
      --cash-bg: #fefce8;
      --cash-border: #fde047;
      --cash-text: #854d0e;
      --cash-badge: #ca8a04;
      --item-bg: #ecfdf5;
      --item-border: #6ee7b7;
      --item-text: #065f46;
      --item-badge: #059669;
    }

    [data-theme="mono"] {
      --ink: #111827;
      --ink-soft: #374151;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #f9fafb;
      --accent: #111827;
      --gold: #111827;
      --cash-bg: #f3f4f6;
      --cash-border: #d1d5db;
      --cash-text: #111827;
      --cash-badge: #111827;
      --item-bg: #ffffff;
      --item-border: #d1d5db;
      --item-text: #1f2937;
      --item-badge: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: var(--sage-surface);
      color: var(--sage-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 48px;
      gap: 18px;
    }

    /* ── Screen Control Bar (Sage Studio) ── */
    .toolbar {
      width: 100%;
      max-width: 297mm;
      background: var(--sage-surface-lowest);
      border: 1px solid var(--sage-outline-variant);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-link {
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--sage-on-surface-variant);
      background: var(--sage-surface-low);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--sage-outline-variant);
      transition: all 120ms ease-out;
    }

    .back-link:hover {
      background: var(--sage-surface-container);
      color: var(--sage-primary);
      border-color: var(--sage-primary);
    }

    .toolbar-title {
      font-family: 'Space Grotesk', 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--sage-on-surface);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-badge {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      background: var(--sage-secondary-container);
      color: var(--sage-on-secondary-container);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--sage-outline-variant);
      background: var(--sage-surface-lowest);
      color: var(--sage-on-surface);
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 120ms ease-out;
    }

    .btn:hover {
      background: var(--sage-surface-low);
      border-color: var(--sage-primary);
    }

    .btn.active {
      background: var(--sage-primary);
      color: #FFFFFF;
      border-color: var(--sage-primary);
    }

    .btn-primary {
      background: var(--sage-primary);
      color: #FFFFFF;
      border-color: var(--sage-primary);
      padding: 8px 16px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--sage-primary-container);
      border-color: var(--sage-primary-container);
    }

    .btn-upload {
      background: var(--sage-secondary-container);
      color: var(--sage-on-secondary-container);
      border-color: var(--sage-outline-variant);
      font-weight: 600;
    }

    .btn-upload:hover {
      background: #BDE0C9;
      border-color: var(--sage-primary);
    }

    .select-group {
      display: inline-flex;
      background: var(--sage-surface-container);
      border: 1px solid var(--sage-outline-variant);
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }

    .select-group .btn {
      border: none;
      background: transparent;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
      color: var(--sage-on-surface-variant);
    }

    .select-group .btn.active {
      background: var(--sage-surface-lowest);
      color: var(--sage-primary);
      font-weight: 600;
    }

    /* ── Status Toast ── */
    .status-banner {
      width: 100%;
      max-width: 297mm;
      background: var(--sage-secondary-container);
      border: 1px solid var(--sage-outline-variant);
      color: var(--sage-on-secondary-container);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
    }

    .status-banner.show {
      display: flex;
    }

    /* ── Editor Panel ── */
    .editor-panel {
      width: 100%;
      max-width: 297mm;
      background: var(--sage-surface-lowest);
      border: 1px solid var(--sage-outline-variant);
      border-radius: 8px;
      padding: 18px 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .editor-panel.open {
      display: flex;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--sage-on-surface-variant);
    }

    .field input {
      border: 1px solid var(--sage-outline-variant);
      background: var(--sage-surface-low);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      color: var(--sage-on-surface);
      outline: none;
      transition: all 120ms ease-out;
    }

    .field input:focus {
      background: var(--sage-surface-lowest);
      border-color: var(--sage-primary);
    }

    .sponsor-editor-box {
      border: 1px solid var(--sage-outline-variant);
      border-radius: 8px;
      padding: 12px;
      background: var(--sage-surface-low);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sponsor-editor-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sponsor-row-input {
      display: grid;
      grid-template-columns: 110px 1fr 1.4fr auto;
      gap: 6px;
      align-items: center;
    }

    .sponsor-row-input select,
    .sponsor-row-input input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12.5px;
      background: #ffffff;
      color: #0f172a;
    }

    .btn-icon {
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #ef4444;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: #fef2f2;
      border-color: #fecaca;
    }

    /* ── A4 Landscape Sheets Container ── */
    .sheets-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      overflow-x: auto;
    }

    .a4-sheet {
      width: 297mm;
      height: 210mm;
      background: #ffffff;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.14);
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .a4-sheet.show-cut::after {
      content: "";
      position: absolute;
      top: 6mm;
      bottom: 6mm;
      left: 50%;
      border-left: 1px dashed #cbd5e1;
      pointer-events: none;
    }

    .cut-mark {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 2mm;
      font-size: 8.5px;
      color: #94a3b8;
      letter-spacing: 0.08em;
      background: #ffffff;
      padding: 0 4px;
      pointer-events: none;
    }

    .a4-sheet:not(.show-cut) .cut-mark {
      display: none;
    }

    /* ── Individual A5 Page (148.5mm x 210mm): 1 Sponsor per Page ── */
    .a5-page {
      width: 148.5mm;
      height: 210mm;
      padding: 13mm 12mm 11mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #ffffff;
    }

    .a5-page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12mm;
      right: 12mm;
      height: 4px;
      background: var(--accent);
      border-radius: 0 0 3px 3px;
    }

    /* ── Flyer Header ── */
    .flyer-header {
      padding-top: 3mm;
      padding-bottom: 5mm;
      border-bottom: 1.5px solid var(--ink);
      display: flex;
      flex-direction: column;
      gap: 2.2mm;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .kicker {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .page-tag {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 2px 8px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .flyer-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--ink);
    }

    .flyer-subtitle-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .flyer-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .flyer-meta {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
    }

    /* ── Single Sponsor Focal Area (Top: Name, Bottom: Cash or Item) ── */
    .sponsor-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: 8mm;
      padding: 6mm 0;
    }

    /* Upper Block: Sponsor Name */
    .stage-name-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3mm;
      padding: 6mm 4mm 2mm;
    }

    .stage-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stage-name-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stage-name {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
      color: var(--ink);
      word-break: keep-all;
    }

    .stage-name.long-name {
      font-size: 34px;
    }

    .stage-honorific {
      font-size: 18px;
      font-weight: 700;
      color: var(--muted);
    }

    /* Divider */
    .stage-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6mm;
    }

    .stage-divider::before,
    .stage-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .type-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 999px;
      color: #ffffff;
    }

    .type-badge.cash {
      background: var(--cash-badge);
    }

    .type-badge.item {
      background: var(--item-badge);
    }

    /* Lower Block: Cash Amount or Item Name */
    .stage-detail-block {
      border-radius: 14px;
      padding: 8mm 6mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2.5mm;
      border: 1.5px solid var(--line);
    }

    .stage-detail-block.cash {
      background: var(--cash-bg);
      border-color: var(--cash-border);
    }

    .stage-detail-block.item {
      background: var(--item-bg);
      border-color: var(--item-border);
    }

    .detail-caption {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stage-detail-block.cash .detail-caption {
      color: var(--cash-text);
    }

    .stage-detail-block.item .detail-caption {
      color: var(--item-text);
    }

    .detail-value {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
      word-break: keep-all;
    }

    .detail-value.long-value {
      font-size: 22px;
    }

    .stage-detail-block.cash .detail-value {
      color: var(--cash-text);
    }

    .stage-detail-block.item .detail-value {
      color: var(--item-text);
    }

    /* Empty Half-Page Placeholder */
    .a5-page.empty-page {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .empty-box {
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      padding: 18mm 10mm;
      width: 100%;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ── Flyer Footer ── */
    .flyer-footer {
      border-top: 1px solid var(--line);
      padding-top: 3.5mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .footer-message {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    .footer-sign {
      font-size: 11px;
      font-weight: 800;
      color: var(--ink);
      white-space: nowrap;
    }

    /* ── Print Rules (Exact A4 Landscape, Multi-Sheet) ── */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .toolbar,
      .editor-panel,
      .status-banner {
        display: none !important;
      }

      .sheets-container {
        gap: 0 !important;
        overflow: visible !important;
        display: block !important;
      }

      .a4-sheet {
        box-shadow: none !important;
        width: 297mm !important;
        height: 210mm !important;
        page-break-after: always;
        break-after: page;
      }

      .a4-sheet:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }

    @media (max-width: 768px) {
      .sponsor-row-input {
        grid-template-columns: 90px 1fr 1fr auto;
      }
    }
  </style>
</head>
<body data-theme="sage">
  <!-- Screen Toolbar (Hidden when printing) -->
  <div class="toolbar">
    <div class="toolbar-left">
      <a href="index.html" class="back-link">← 포탈</a>
      <div class="toolbar-title">
        <span>토당클럽(테미모) 4분기 클럽데이 · 찬조자 광고지</span>
        <span class="toolbar-badge" id="sheetCountBadge">A4 2매 · 1쪽 1인</span>
      </div>
    </div>

    <div class="toolbar-controls">
      <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleExcelUpload(event)" />
      <button class="btn btn-upload" onclick="document.getElementById('excelInput').click()">엑셀/CSV 업로드</button>
      <button class="btn" onclick="downloadTemplate()">양식 다운로드</button>

      <div class="select-group" role="group" aria-label="컬러 테마">
        <button class="btn active" data-theme-btn="sage" onclick="setTheme('sage')">Sage Studio</button>
        <button class="btn" data-theme-btn="navy" onclick="setTheme('navy')">네이비·골드</button>
        <button class="btn" data-theme-btn="emerald" onclick="setTheme('emerald')">에메랄드</button>
        <button class="btn" data-theme-btn="mono" onclick="setTheme('mono')">모노크롬</button>
      </div>

      <button class="btn active" id="btnCutLine" onclick="toggleCutLine()">재단선</button>
      <button class="btn" id="btnToggleEditor" onclick="toggleEditor()">명단 편집</button>
      <button class="btn btn-primary" onclick="window.print()">인쇄 / PDF 저장</button>
    </div>
  </div>

  <!-- Upload / Action Status Banner -->
  <div class="status-banner" id="statusBanner">
    <span id="statusText"></span>
    <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="hideStatus()">닫기</button>
  </div>

  <!-- Live Editor Panel (Hidden when printing) -->
  <div class="editor-panel" id="editorPanel">
    <div class="editor-grid">
      <div class="field">
        <label for="inKicker">상단 영문 라벨</label>
        <input id="inKicker" type="text" oninput="updateMeta()" />
      </div>
      <div class="field">
        <label for="inTitle">행사 제목</label>
        <input id="inTitle" type="text" oninput="updateMeta()" />
      </div>
      <div class="field">
        <label for="inSubtitle">부제목</label>
        <input id="inSubtitle" type="text" oninput="updateMeta()" />
      </div>
      <div class="field">
        <label for="inMeta">일시 / 장소</label>
        <input id="inMeta" type="text" oninput="updateMeta()" />
      </div>
      <div class="field">
        <label for="inFooterMsg">하단 감사 문구</label>
        <input id="inFooterMsg" type="text" oninput="updateMeta()" />
      </div>
      <div class="field">
        <label for="inFooterSign">하단 서명</label>
        <input id="inFooterSign" type="text" oninput="updateMeta()" />
      </div>
    </div>

    <div class="sponsor-editor-box">
      <div class="sponsor-editor-head">
        <span>찬조자 명단 (1쪽마다 1명씩 배치 · 상단 이름 / 하단 현금·물품)</span>
        <div style="display:flex; gap:6px;">
          <button class="btn" onclick="addSponsor('cash')">+ 현금 추가</button>
          <button class="btn" onclick="addSponsor('item')">+ 물품 추가</button>
        </div>
      </div>
      <div id="sponsorEditorList" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <span style="font-size:12px; color:#64748b;">
        엑셀 업로드 형식: <strong>구분(현금/물품) · 이름 · 내역(금액 또는 물품명)</strong> 3열 또는 <strong>이름 · 내역</strong> 2열 모두 자동 인식됩니다. 인쇄 시 <strong>방향: 가로 · 여백: 없음 · 배경 그래픽: 켜기</strong>를 선택하세요.
      </span>
      <button class="btn" onclick="resetDefaults()">기본 예시로 초기화</button>
    </div>
  </div>

  <!-- Printable A4 Landscape Sheets -->
  <div class="sheets-container" id="sheetsContainer"></div>

  <script>
    const STORAGE_KEY = 'todang_temimo_4q_flyer_v2';

    const DEFAULT_STATE = {
      theme: 'sage',
      showCut: true,
      meta: {
        kicker: '2026 4Q CLUB DAY · SPECIAL THANKS',
        title: '토당클럽(테미모) 4분기 클럽데이',
        subtitle: '찬조자 감사 광고',
        info: '2026. 11. 28 (토) · 토당클럽',
        footerMsg: '보내주신 따뜻한 성원과 찬조에 깊이 감사드립니다.',
        footerSign: '토당클럽(테미모) 일동'
      },
      sponsors: [
        { type: 'cash', name: '김태현', value: '100,000원' },
        { type: 'item', name: '강현우', value: '고급 스포츠 타월 30매' },
        { type: 'cash', name: '박지훈', value: '100,000원' },
        { type: 'item', name: '윤서연', value: '생수 500ml × 3박스' }
      ]
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return { ...structuredClone(DEFAULT_STATE), ...parsed };
      } catch {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch {}
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showStatus(msg) {
      const banner = document.getElementById('statusBanner');
      document.getElementById('statusText').textContent = msg;
      banner.classList.add('show');
    }

    function hideStatus() {
      document.getElementById('statusBanner').classList.remove('show');
    }

    function buildSingleSponsorPage(sponsor, index, total) {
      const { meta } = state;
      if (!sponsor) {
        return `
          <section class="a5-page empty-page">
            <div class="empty-box">
              <strong style="font-size:14px; color:var(--ink);">${escapeHtml(meta.title)}</strong>
              <span style="font-size:12px;">${escapeHtml(meta.footerMsg)}</span>
            </div>
          </section>
        `;
      }

      const isCash = sponsor.type === 'cash';
      const nameStr = String(sponsor.name || '').trim();
      const valStr = String(sponsor.value || '').trim();
      const isLongName = nameStr.length > 5;
      const isLongVal = valStr.length > 12;

      return `
        <section class="a5-page">
          <header class="flyer-header">
            <div class="header-top-row">
              <span class="kicker">${escapeHtml(meta.kicker)}</span>
              <span class="page-tag">${index + 1} / ${total}</span>
            </div>
            <h1 class="flyer-title">${escapeHtml(meta.title)}</h1>
            <div class="flyer-subtitle-row">
              <span class="flyer-subtitle">${escapeHtml(meta.subtitle)}</span>
              <span class="flyer-meta">${escapeHtml(meta.info)}</span>
            </div>
          </header>

          <main class="sponsor-stage">
            <!-- 상단: 찬조자 이름 -->
            <div class="stage-name-block">
              <span class="stage-label">SPECIAL SPONSOR</span>
              <div class="stage-name-row">
                <span class="stage-name ${isLongName ? 'long-name' : ''}">${escapeHtml(nameStr)}</span>
                <span class="stage-honorific">님</span>
              </div>
            </div>

            <!-- 중앙 구분선 및 현금/물품 배지 -->
            <div class="stage-divider">
              <span class="type-badge ${isCash ? 'cash' : 'item'}">
                ${isCash ? '현금 찬조' : '물품 찬조'}
              </span>
            </div>

            <!-- 하단: 현금 또는 물품명 -->
            <div class="stage-detail-block ${isCash ? 'cash' : 'item'}">
              <span class="detail-caption">${isCash ? '찬조 금액' : '찬조 물품'}</span>
              <div class="detail-value ${isLongVal ? 'long-value' : ''}">${escapeHtml(valStr)}</div>
            </div>
          </main>

          <footer class="flyer-footer">
            <p class="footer-message">${escapeHtml(meta.footerMsg)}</p>
            <span class="footer-sign">${escapeHtml(meta.footerSign)}</span>
          </footer>
        </section>
      `;
    }

    function renderSheets() {
      const container = document.getElementById('sheetsContainer');
      const list = state.sponsors;
      const total = list.length;
      const sheetCount = Math.max(1, Math.ceil(total / 2));

      document.getElementById('sheetCountBadge').textContent =
        `A4 ${sheetCount}장 · 총 ${total}명 (1쪽 1인)`;

      if (total === 0) {
        container.innerHTML = `
          <div class="a4-sheet ${state.showCut ? 'show-cut' : ''}">
            <div class="cut-mark">✂ CUT / FOLD</div>
            ${buildSingleSponsorPage(null, 0, 0)}
            ${buildSingleSponsorPage(null, 0, 0)}
          </div>
        `;
        return;
      }

      let html = '';
      for (let i = 0; i < total; i += 2) {
        const leftSponsor = list[i];
        const rightSponsor = list[i + 1] || null;
        html += `
          <div class="a4-sheet ${state.showCut ? 'show-cut' : ''}">
            <div class="cut-mark">✂ CUT / FOLD</div>
            ${buildSingleSponsorPage(leftSponsor, i, total)}
            ${buildSingleSponsorPage(rightSponsor, i + 1, total)}
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderEditor() {
      document.getElementById('inKicker').value = state.meta.kicker;
      document.getElementById('inTitle').value = state.meta.title;
      document.getElementById('inSubtitle').value = state.meta.subtitle;
      document.getElementById('inMeta').value = state.meta.info;
      document.getElementById('inFooterMsg').value = state.meta.footerMsg;
      document.getElementById('inFooterSign').value = state.meta.footerSign;

      const el = document.getElementById('sponsorEditorList');
      el.innerHTML = state.sponsors.map((s, idx) => `
        <div class="sponsor-row-input">
          <select onchange="updateSponsor(${idx}, 'type', this.value)">
            <option value="cash" ${s.type === 'cash' ? 'selected' : ''}>현금 찬조</option>
            <option value="item" ${s.type === 'item' ? 'selected' : ''}>물품 찬조</option>
          </select>
          <input type="text" value="${escapeHtml(s.name)}" placeholder="찬조자 이름" oninput="updateSponsor(${idx}, 'name', this.value)" />
          <input type="text" value="${escapeHtml(s.value)}" placeholder="금액 또는 물품명" oninput="updateSponsor(${idx}, 'value', this.value)" />
          <button class="btn-icon" title="삭제" onclick="removeSponsor(${idx})">×</button>
        </div>
      `).join('');
    }

    function updateMeta() {
      state.meta.kicker = document.getElementById('inKicker').value;
      state.meta.title = document.getElementById('inTitle').value;
      state.meta.subtitle = document.getElementById('inSubtitle').value;
      state.meta.info = document.getElementById('inMeta').value;
      state.meta.footerMsg = document.getElementById('inFooterMsg').value;
      state.meta.footerSign = document.getElementById('inFooterSign').value;
      saveState();
      renderSheets();
    }

    function updateSponsor(idx, field, val) {
      if (state.sponsors[idx]) {
        state.sponsors[idx][field] = val;
        saveState();
        renderSheets();
      }
    }

    function addSponsor(type) {
      state.sponsors.push(
        type === 'cash'
          ? { type: 'cash', name: '홍길동', value: '50,000원' }
          : { type: 'item', name: '홍길동', value: '찬조 물품' }
      );
      saveState();
      renderEditor();
      renderSheets();
    }

    function removeSponsor(idx) {
      state.sponsors.splice(idx, 1);
      saveState();
      renderEditor();
      renderSheets();
    }

    function detectType(rawType, rawValue) {
      const t = String(rawType || '').trim().toLowerCase();
      if (t.includes('현금') || t === 'cash') return 'cash';
      if (t.includes('물품') || t === 'item' || t === 'goods') return 'item';
      const v = String(rawValue || '').trim();
      if (/^\d[\d,]*\s*(원|만원)?$/.test(v) || v.includes('만원') || v.endsWith('원')) {
        return 'cash';
      }
      return 'item';
    }

    function formatValueIfNumericCash(type, val) {
      const v = String(val || '').trim();
      if (type === 'cash' && /^\d[\d,]*$/.test(v)) {
        return Number(v.replace(/,/g, '')).toLocaleString('ko-KR') + '원';
      }
      return v;
    }

    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        alert('엑셀 파서를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

          const nonEmptyRows = rows.filter((r) => r.some((cell) => String(cell).trim() !== ''));
          if (nonEmptyRows.length === 0) {
            alert('업로드된 파일에 데이터가 없습니다.');
            return;
          }

          // Check if first row is a header
          const header = nonEmptyRows[0].map((c) => String(c).trim());
          let typeIdx = header.findIndex((h) => /구분|유형|종류|타입/.test(h));
          let nameIdx = header.findIndex((h) => /이름|성명|찬조자|성함/.test(h));
          let valIdx = header.findIndex((h) => /내역|금액|물품|찬조내역|품목|내용/.test(h));

          let startRow = 0;
          if (typeIdx !== -1 || nameIdx !== -1 || valIdx !== -1) {
            startRow = 1;
            if (nameIdx === -1) nameIdx = typeIdx === 0 ? 1 : 0;
            if (valIdx === -1) valIdx = Math.max(nameIdx + 1, typeIdx + 1);
          } else {
            // No header detected: infer 3 columns (구분, 이름, 내역) or 2 columns (이름, 내역)
            const colCount = nonEmptyRows[0].length;
            if (colCount >= 3) {
              typeIdx = 0;
              nameIdx = 1;
              valIdx = 2;
            } else {
              typeIdx = -1;
              nameIdx = 0;
              valIdx = 1;
            }
          }

          const parsed = [];
          for (let i = startRow; i < nonEmptyRows.length; i++) {
            const row = nonEmptyRows[i];
            const name = String(row[nameIdx] ?? '').trim();
            const rawVal = String(row[valIdx] ?? '').trim();
            const rawType = typeIdx !== -1 ? String(row[typeIdx] ?? '').trim() : '';

            if (!name && !rawVal) continue;
            const type = detectType(rawType, rawVal);
            const value = formatValueIfNumericCash(type, rawVal);
            parsed.push({ type, name: name || '찬조자', value: value || '-' });
          }

          if (parsed.length === 0) {
            alert('인식된 찬조자 명단이 없습니다. 열 구성을 확인해 주세요.');
            return;
          }

          state.sponsors = parsed;
          saveState();
          renderEditor();
          renderSheets();
          showStatus(`"${file.name}"에서 총 ${parsed.length}명의 찬조자 명단을 불러왔습니다. (A4 ${Math.ceil(parsed.length / 2)}장 생성)`);
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function downloadTemplate() {
      const csvContent = '\uFEFF' + [
        '구분,이름,내역',
        '현금,김태현,100000',
        '물품,강현우,고급 스포츠 타월 30매',
        '현금,박지훈,50000',
        '물품,윤서연,생수 500ml × 3박스'
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '토당클럽_테미모_찬조자_양식.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function setTheme(theme) {
      state.theme = theme;
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('[data-theme-btn]').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === theme);
      });
      saveState();
    }

    function toggleCutLine() {
      state.showCut = !state.showCut;
      document.getElementById('btnCutLine').classList.toggle('active', state.showCut);
      saveState();
      renderSheets();
    }

    function toggleEditor() {
      const panel = document.getElementById('editorPanel');
      const isOpen = panel.classList.toggle('open');
      document.getElementById('btnToggleEditor').classList.toggle('active', isOpen);
    }

    function resetDefaults() {
      state = structuredClone(DEFAULT_STATE);
      saveState();
      applyInitialUI();
      showStatus('기본 예시 명단으로 초기화되었습니다.');
    }

    function applyInitialUI() {
      setTheme(state.theme);
      document.getElementById('btnCutLine').classList.toggle('active', state.showCut);
      renderEditor();
      renderSheets();
    }

    applyInitialUI();
  </script>
</body>
</html>
